<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Items | KS25 Base</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
  <header id="app-header"></header>

  <div class="container" style="margin-top: 20px;">
    <div class="card-panel" style="padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
      <div style="font-weight: 700; color: var(--text-main);">🚀 Kiểm tra kết nối Base Code FastAPI + MySQL (CRUD Mẫu)</div>
      <div id="db-health-badge" style="padding: 4px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3);">
        Đang kiểm tra kết nối MySQL...
      </div>
    </div>
  </div>

  <main class="container layout-2col" style="padding-top: 20px; padding-bottom: 50px;">
    <!-- Form thêm / sửa -->
    <section class="card">
      <h2 id="form-title">Thêm item mới</h2>
      <form id="item-form">
        <label for="name">Tên *</label>
        <input id="name" name="name" type="text" required maxlength="255" placeholder="VD: Cơm rang">

        <label for="price">Giá (VNĐ)</label>
        <input id="price" name="price" type="number" min="0" step="1000" placeholder="0">

        <label for="description">Mô tả</label>
        <textarea id="description" name="description" rows="3" placeholder="Không bắt buộc"></textarea>

        <div class="form-actions">
          <button id="btn-submit" type="submit" class="btn btn-primary">Thêm</button>
          <button id="btn-cancel" type="button" class="btn" hidden>Huỷ</button>
        </div>
      </form>
    </section>

    <!-- Danh sách -->
    <section class="card">
      <div class="list-header">
        <h2>Danh sách items</h2>
        <input id="search-input" type="search" placeholder="Tìm theo tên...">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Tên</th>
              <th class="text-right">Giá</th>
              <th>Ngày tạo</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="item-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/items.js"></script>
</body>
</html>
