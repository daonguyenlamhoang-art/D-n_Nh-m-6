<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Đơn Hàng | NightFood</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="./">
  <header id="app-header"></header>

  <main class="container" style="padding-top: 36px; padding-bottom: 60px;">
    <div style="max-width: 760px; margin: 0 auto;">
      <h1 class="section-title" style="margin-bottom: 12px; justify-content: center;">
        🔍 Tra Cứu Tiến Độ Đơn Hàng
      </h1>
      <p style="color:var(--text-muted); text-align: center; margin-bottom: 28px;">
        Nhập chính xác <strong>Mã đơn hàng</strong> và <strong>Số điện thoại</strong> đặt hàng để theo dõi món ăn của bạn (FR-07)
      </p>

      <!-- Form tra cứu -->
      <div class="card-panel" style="margin-bottom: 28px;">
        <form id="lookup-form">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group">
              <label class="form-label">Mã đơn hàng <span class="req">*</span></label>
              <input type="text" id="lookup-code" class="form-control" placeholder="Ví dụ: NF123456" maxlength="30" required style="text-transform:uppercase;">
            </div>

            <div class="form-group">
              <label class="form-label">Số điện thoại nhận hàng <span class="req">*</span></label>
              <input type="tel" id="lookup-phone" class="form-control" placeholder="Ví dụ: 0912345678" maxlength="10" required>
            </div>
          </div>

          <button type="submit" id="btn-lookup-submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:1rem; margin-top:8px;">
            🔍 Tra Cứu Ngay
          </button>
        </form>
      </div>

      <!-- Khu vực hiển thị kết quả theo dõi 1 đơn (Tự cập nhật mỗi 15 giây - T3D29F3) -->
      <div id="lookup-result-container" style="margin-bottom: 36px;"></div>

      <!-- Khu vực: Đơn Hàng Của Tôi theo tab trạng thái (T3D29F3) -->
      <div class="card-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
          <h3 style="font-size:1.2rem; font-weight:800;">📋 Đơn Hàng Của Tôi</h3>
          <button type="button" id="btn-refresh-my-orders" class="btn btn-secondary" style="padding:5px 12px; font-size:0.82rem;">
            🔄 Tải lại danh sách
          </button>
        </div>

        <div id="my-orders-status-tabs" class="category-tabs" style="margin-bottom:16px; padding-bottom:10px;">
          <button class="category-tab active" data-status="">Tất cả</button>
          <button class="category-tab" data-status="pending">Chờ xác nhận</button>
          <button class="category-tab" data-status="confirmed">Đã xác nhận</button>
          <button class="category-tab" data-status="preparing">Đang chuẩn bị</button>
          <button class="category-tab" data-status="delivering">Đang giao</button>
          <button class="category-tab" data-status="completed">Hoàn thành</button>
          <button class="category-tab" data-status="cancelled">Đã huỷ</button>
        </div>

        <div id="my-orders-list-container">
          <div style="text-align:center; padding:24px; color:var(--text-dim);">Đang tải đơn hàng của bạn...</div>
        </div>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart-storage.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/lookup.js"></script>
</body>
</html>
